# Note: Template blocks require a 'weight' parameter so they're correctly ordered on the landing page

# Hero
hero:
  enable: true
  weight: 15
  template: hero

  backgroundImage:
    path: "images/templates/hero"
    filename:
      desktop: "gradient-desktop.webp"
      mobile: "gradient-mobile.webp"

  badge:
    # text: v0.1.0
    color: primary # primary, secondary, success, danger, warning, info, light, dark
    pill: false # boolean
    soft: true # boolean

  # titleLogo:
  #   path: "images/logos"
  #   filename: "title_logo.png"
  #   alt: "Lotus Docs Logo"
  #   height: 80px
#
  title: "장세훈입니다."
  subtitle: 저는**전북대학교 컴퓨터인공지능학부 23학번 학부생 입니다.** 효율적이고,안전하고 믿을 수 있는 프로그래밍을 하겠습니다. JSP를 통한 백엔드 개발 능력이 있으며, flask등 웹 프레임워크 개발 경험이 있습니다. 

  ctaButton:
    icon: rocket_launch
    btnText: "more"
    url: "/docs/quickstart/#create-a-new-lotus-docs-site"
  cta2Button:
    icon: construction
    btnText: "github repo/"
    url: "https://github.com/408cake?tab=repositories"

# Feature Grid
featureGrid:
  enable: true
  weight: 20
  template: feature grid

  title: Why choose Lotus Docs?
  subtitle: Lotus Docs is a highly configurable Hugo documentation theme. Yet, with the default configuration you can deploy and publish your documentation site in a matter of minutes. Check out some core features below.

  items:
    - title: 작은 수익을 목적으로 개발합니다.
      icon: trending_up
      description: 큰 돈을 벌기 위해서는 먼저 한 사람에게서 500원을 정기적으로 벌어들일 수 있어야 한다고 합니다. sideyes같은 프로젝트는 심플하고, 사람들의 니즈에 맞춰서 제작중인 프로그램 입니다.

    - title: 보안을 생각합니다.
      icon: lock
      description: key가 실수로 푸쉬되진 않았는지, 개발시에 보안 위협은 없을지에 대해서 생각을 많이 할려고 노력하는 중입니다.

    - title: 효율적인 개발을 지향합니다.
      icon: Fast
      description: 캐시, 메모리, 효율적인 저장, 효율적인 작동 등을 고려해서 요금이 많이 나가거나 하는 상황을 최소화 하려고 노력합니다.

    - title: 영문 자료 해석에 겁먹지 않습니다.
      icon: translate
      description: stackoverflow, 영문 논문을 최대한 읽고 해석하기 위해 부단한 노력중입니다.
